# Evidence Compiler — per-repo configuration template.
# Copy to <repo>/.evidence-compiler/config.yaml (or run `evidence init`).
# Core runs on built-in defaults if this file is absent; every key is optional.
# Product-specific policy (BIMpossible/Revit/APS conventions, project rules)
# belongs in this file, never in core package code.

storage:
  # Must resolve beneath .evidence-compiler/ — the hook-safe launcher refuses
  # to run (fail-open, nothing injected) if this escapes that boundary.
  dir: .evidence-compiler/packets

# Bounded packet retention, applied by `evidence hook-safe` after each
# successful persist: the newest max_packets files are kept, older packets
# are deleted. Set 0 to disable retention entirely.
retention:
  max_packets: 250

# Adapter end-to-end hard safety ceiling (ms). Operational target is p95 < 1s;
# this is the absolute ceiling (context-brief spec §5).
deadline_ms: 25000

budget:
  min_tokens: 600
  default_tokens: 1000
  max_tokens: 1200

collectors:
  git:
    enabled: true
    # Shared across six git calls (each gets at least 100 ms). On Windows a
    # git spawn costs ~40 ms, so 250 ms starved `git status` and silently
    # dropped the dirty overlay; the collector now reports `dirty_state`.
    timeout_ms: 600
  ripgrep:
    enabled: true
    # Shared across all searched symbols (each gets at least 100 ms). Symbols
    # that cannot be searched within budget are recorded as `not_searched`.
    timeout_ms: 1500
    extra_args: []
  graphify:
    # Phase 1A stub: always reports "skipped / not implemented".
    enabled: true
    timeout_ms: 1250

scoping:
  # Case-insensitive symbol values this repo never wants searched. The
  # repository's own folder name is rejected automatically. Add product or
  # tool names that recur in prompts but never identify code.
  ignore_symbols: []

review:
  # `evidence review status` warns that a review window is due once either
  # threshold is crossed since `evidence review window start`. 0 disables.
  window_days: 14
  window_candidates: 10
